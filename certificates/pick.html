<!DOCTYPE html><html><head><meta charset="utf-8"><title>Folder test</title><meta name="viewport" content="width=device-width"></head>
<body style="font:18px Segoe UI,sans-serif;padding:30px">
<h2>Folder test</h2>
<button id="b1" style="font-size:20px;padding:12px 24px">1 – Choose folder (view)</button>
<button id="b2" style="font-size:20px;padding:12px 24px">2 – Choose folder (edit)</button>
<pre id="o" style="margin-top:20px;font-size:16px;white-space:pre-wrap"></pre>
<script>
var o=document.getElementById('o');function log(t){o.textContent+=new Date().toLocaleTimeString()+'  '+t+'\n';}
log('showDirectoryPicker: '+typeof window.showDirectoryPicker+' · '+navigator.userAgent);
function go(m){log('opening, mode='+m);var t0=Date.now();window.showDirectoryPicker({mode:m}).then(function(h){log('OK: '+h.name+' ('+(Date.now()-t0)+' ms)');var n=0,it=h.entries();(function nx(){it.next().then(function(r){if(r.done||n>=5){log('first entries read: '+n);return;}n++;log('  - '+r.value[0]);nx();});})();}).catch(function(e){log('ERROR '+e.name+': '+e.message+' ('+(Date.now()-t0)+' ms)');});}
document.getElementById('b1').onclick=function(){go('read');};document.getElementById('b2').onclick=function(){go('readwrite');};
</script></body></html>
